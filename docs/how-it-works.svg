<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Privacy Guard flow: game focused shows the game, focus lost shows blur, masks hide fixed areas">
  <style>
    .bg { fill: #12151c; }
    .card { fill: #1b2029; stroke: #2c3442; stroke-width: 1.5; rx: 10; }
    .label { fill: #e6ebf2; font: 600 15px "Segoe UI", Arial, sans-serif; }
    .sub { fill: #8b96a7; font: 13px "Segoe UI", Arial, sans-serif; }
    .accent { fill: #4c9aff; }
    .warn { fill: #ffb020; }
    .ok { fill: #37c98b; }
    .mono { fill: #9fb0c6; font: 12px Consolas, monospace; }
  </style>

  <rect class="bg" width="860" height="330"/>

  <text x="30" y="40" class="label">Privacy Guard: what viewers see</text>
  <text x="30" y="60" class="sub">One filter on the capture source. Your monitor is untouched.</text>

  <!-- card 1 -->
  <g>
    <rect class="card" x="30" y="85" width="240" height="150"/>
    <rect x="46" y="101" width="208" height="86" fill="#22384f" stroke="#3f6b93"/>
    <text x="150" y="150" text-anchor="middle" class="ok">game frame</text>
    <text x="150" y="205" text-anchor="middle" class="label">Game focused</text>
    <text x="150" y="223" text-anchor="middle" class="sub">image open, sharp</text>
  </g>

  <!-- card 2 -->
  <g>
    <rect class="card" x="310" y="85" width="240" height="150"/>
    <rect x="326" y="101" width="208" height="86" fill="#2a3550" stroke="#3f6b93"/>
    <g opacity="0.55">
      <rect x="336" y="111" width="46" height="26" fill="#7f8ea6"/>
      <rect x="392" y="111" width="60" height="26" fill="#66748c"/>
      <rect x="462" y="111" width="62" height="26" fill="#7f8ea6"/>
      <rect x="336" y="147" width="90" height="30" fill="#66748c"/>
      <rect x="436" y="147" width="88" height="30" fill="#7f8ea6"/>
    </g>
    <text x="430" y="205" text-anchor="middle" class="label">Left the game</text>
    <text x="430" y="223" text-anchor="middle" class="sub">blur or pixelate, instant</text>
  </g>

  <!-- card 3 -->
  <g>
    <rect class="card" x="590" y="85" width="240" height="150"/>
    <rect x="606" y="101" width="208" height="86" fill="#22384f" stroke="#3f6b93"/>
    <text x="710" y="150" text-anchor="middle" class="ok">game frame</text>
    <rect x="606" y="101" width="70" height="40" fill="#0b0e13"/>
    <rect x="748" y="147" width="66" height="40" fill="#0b0e13"/>
    <text x="710" y="205" text-anchor="middle" class="label">Private areas</text>
    <text x="710" y="223" text-anchor="middle" class="sub">masks over nicks and chat</text>
  </g>

  <!-- arrows -->
  <g stroke="#4c9aff" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="272" y1="160" x2="304" y2="160"/>
    <line x1="552" y1="160" x2="584" y2="160"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4c9aff"/>
    </marker>
  </defs>

  <text x="30" y="272" class="sub">Fail-closed by design: no input frame, unknown state or shader error shows an opaque cover, never a raw frame.</text>
  <text x="30" y="296" class="mono">OBS 32.2.2 · Windows x64 · C++17 · CMake · GPL-2.0</text>
  <text x="30" y="316" class="sub">Manual hotkey always wins over automatic restore.</text>
</svg>
