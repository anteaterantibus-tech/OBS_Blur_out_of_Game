Prop_GameDir_Desc="Укажи папку, где лежат игры. Плагин сам найдет все EXE в ней и подпапках (глубина 3) и добавит их в список. Служебные файлы (uninstall, setup, crash-репортеры) пропускаются. Переключаться между играми можно без изменения настроек."
